# Loaded as a base layer for every test context, including @DataJpaTest
# slices that run with no active profile (so application-test.properties
# alone wouldn't reach them). Flyway's migrations are Postgres-flavored
# SQL and would fail against the H2 database these tests use - disable
# it here instead of per-test-class.
spring.flyway.enabled=false

# Maven puts target/test-classes ahead of target/classes on the test
# classpath, so this file entirely SHADOWS src/main/resources/application.properties
# for classpath:application.properties lookups during tests - it does not
# layer on top of it. Tests that rely on @ActiveProfiles("test") still get
# application-test.properties on top of this file, but anything only
# defined in the main application.properties (like jwt.secret) is NOT
# inherited and must be repeated here instead.
#
# JwtTokenProvider's @Value default for jwt.secret is NOT valid base64
# (it contains hyphens), so leaving this unset doesn't "fall back safely" -
# it throws inside token generation, which AuthController's broad catch
# turns into a misleading 401 "Invalid username or password" on every login.
jwt.secret=YmpqLXRvdXJuYW1lbnQtc2VjcmV0LWtleS1jaGFuZ2UtdGhpcy1pbi1wcm9kdWN0aW9uLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
jwt.expiration=86400000
